<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test World</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
  #hud { position: fixed; left: 0; right: 0; bottom: 24px; display: none; justify-content: center; gap: 12px; z-index: 5; }
  #hud button { padding: 12px 28px; font-size: 16px; border: 0; border-radius: 8px; cursor: pointer; background: #e8e8e8; }
  #hud button:hover:not(:disabled) { background: #fff; }
  #hud button:disabled { opacity: .4; cursor: default; }
  #msg { position: fixed; top: 12px; left: 12px; color: #fff; font-size: 14px; white-space: pre-line; z-index: 5; text-shadow: 0 1px 3px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="msg">Loading...</div>
<div id="hud">
  <button id="burp">Burp</button>
  <button id="digest">Digest</button>
  <button id="reset">Reset</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- CONFIG ----------
// raw.githubusercontent.com serves files as text/plain, which browsers refuse for audio. jsDelivr serves them correctly.
const CDN = 'https://cdn.jsdelivr.net/gh/NecroHub/testworld@main/';
const burpFiles = [
  'A_wet,_strained_burp_#1-1792486381549.mp3',
  'A_wet,_strained_burp_#2-1792486384120.mp3',
  'A_wet,_strained_burp_#3-1792486386321.mp3',
  'A_wet,_strained_burp_#4-1792486388609.mp3',
  'wet,_gurgling_burp_t_#2-1792486268750.mp3',
];

const CONFIG = {
  girlUrl: 'GirlModel.glb',
  boyUrl: 'Boymodel.glb',
  stomachUrl: 'Stomach_Inside_small.glb',
  preyName: 'BellyPrey1',
  digestTargetName: 'BellyDigest',
  hiddenExtras: ['BellyPrey2'],
  stomachOffset: new THREE.Vector3(0, 0, -500),
  boyPosition: new THREE.Vector3(3, 0, -2),
  digestDuration: 4.0,
  moveSpeed: 4,
  turnSpeed: 12,
  // encodeURIComponent so the commas and # in the file names survive
  // each entry = list of sources to try in order: jsDelivr (proper audio headers + CORS), then a local copy
  BURP_SOUNDS: burpFiles.map(f => [CDN + encodeURIComponent(f), encodeURIComponent(f)]),
};

// ---------- DOM / STATE ----------
const msg = document.getElementById('msg');
const hud = document.getElementById('hud');
const btnBurp = document.getElementById('burp');
const btnDigest = document.getElementById('digest');
const btnReset = document.getElementById('reset');
const setMsg = t => { msg.textContent = t; };
const HINT = 'WASD / arrows: move\nDrag: orbit camera\nClick the boy.';

const state = { eaten: false, digesting: false, digested: false };
let tween = null;

// ---------- RENDERER / SCENE ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f27);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 5);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x2c3340 })
);
scene.add(ground);
scene.add(new THREE.GridHelper(60, 60, 0x445066, 0x2f3745));

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(0, 2.5, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;

const stomachRoot = new THREE.Group();
stomachRoot.position.copy(CONFIG.stomachOffset);
scene.add(stomachRoot);

// ---------- HELPERS ----------
const loader = new GLTFLoader();
const loadGLB = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));

function findNode(root, name) {
  const lower = name.toLowerCase();
  let hit = null;
  root.traverse(o => { if (!hit && o.name && o.name.toLowerCase() === lower) hit = o; });
  if (!hit) root.traverse(o => { if (!hit && o.name && o.name.toLowerCase().includes(lower)) hit = o; });
  return hit;
}
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// Remove animation tracks that drive these nodes (or their children), so the
// idle/walk clips can't hide or zero-scale the belly every frame.
function stripTracksFor(clips, nodes) {
  const keys = new Set();
  nodes.filter(Boolean).forEach(n => n.traverse(o => { keys.add(o.name); keys.add(o.uuid); }));
  clips.forEach(clip => {
    const before = clip.tracks.length;
    clip.tracks = clip.tracks.filter(t => {
      const node = t.name.split('.')[0];
      return !keys.has(node);
    });
    if (clip.tracks.length !== before) {
      console.log('Clip "' + clip.name + '": removed ' + (before - clip.tracks.length) + ' belly track(s)');
    }
  });
}

// Make a node actually drawable: itself, its children, its ancestors.
function forceShow(node) {
  for (let p = node; p; p = p.parent) p.visible = true;
  node.traverse(o => {
    o.visible = true;
    if (o.isMesh) {
      o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m && m.opacity === 0) { m.opacity = 1; } if (m) m.visible = true; });
    }
  });
}

function fixTinyScale(node) {
  if (node && node.scale.x < 1e-3 && node.scale.y < 1e-3 && node.scale.z < 1e-3) {
    console.warn('"' + node.name + '" had ~zero scale in the file, resetting to 1');
    node.scale.set(1, 1, 1);
  }
}

function makeAnimator(root, clips) {
  const mixer = new THREE.AnimationMixer(root);
  const actions = {};
  clips.forEach(c => { actions[c.name.toLowerCase()] = mixer.clipAction(c); });
  let base = null;
  return {
    mixer, actions,
    has: n => !!actions[n.toLowerCase()],
    setBase(name, fade = 0.2) {
      const next = actions[name.toLowerCase()];
      if (!next || next === base) return;
      next.reset().setLoop(THREE.LoopRepeat, Infinity);
      next.enabled = true;
      if (base) next.crossFadeFrom(base, fade, false);
      next.play();
      base = next;
    },
    // plays a one-shot clip; returns a promise that resolves when it finishes (immediately if no such clip)
    overlay(name) {
      const a = actions[name.toLowerCase()];
      if (!a) return Promise.resolve();
      a.reset().setLoop(THREE.LoopOnce, 1);
      a.clampWhenFinished = false;
      return new Promise(res => {
        const h = e => {
          if (e.action !== a) return;
          mixer.removeEventListener('finished', h);
          res();
        };
        mixer.addEventListener('finished', h);
        a.play();
      });
    },
    update(dt) { mixer.update(dt); },
  };
}

// ---------- AUDIO ----------
const audioCache = new Map();
let audioCtx = null;
let lastBurp = -1;

function synthBurp() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = audioCtx.currentTime;
  const dur = 0.6 + Math.random() * 0.5;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(90 + Math.random() * 40, t0);
  osc.frequency.exponentialRampToValueAtTime(45, t0 + dur);
  lfo.frequency.value = 25 + Math.random() * 20;
  lfoGain.gain.value = 30;
  lfo.connect(lfoGain).connect(osc.frequency);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); lfo.start(t0);
  osc.stop(t0 + dur); lfo.stop(t0 + dur);
}

const getCtx = () => (audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)());

// fetch + decode every burp up front so the click plays instantly
const burpBuffers = [];
async function loadBurp(sources) {
  for (const url of sources) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await getCtx().decodeAudioData(await res.arrayBuffer());
      console.log('Loaded burp:', url, buf.duration.toFixed(2) + 's');
      return buf;
    } catch (err) {
      console.warn('Burp source failed (' + url + '):', err.message || err);
    }
  }
  return null;
}
Promise.all(CONFIG.BURP_SOUNDS.map(loadBurp)).then(list => {
  list.forEach(b => b && burpBuffers.push(b));
  console.log(burpBuffers.length + '/' + CONFIG.BURP_SOUNDS.length + ' burp sounds ready');
});

// returns a promise that resolves when the sound has finished
function playBurp() {
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  if (!burpBuffers.length) {
    console.warn('No burp files loaded, using synth fallback');
    synthBurp();
    return new Promise(r => setTimeout(r, 1000));
  }
  let i;
  do { i = Math.floor(Math.random() * burpBuffers.length); } while (burpBuffers.length > 1 && i === lastBurp);
  lastBurp = i;
  const src = ctx.createBufferSource();
  src.buffer = burpBuffers[i];
  src.connect(ctx.destination);
  return new Promise(res => { src.onended = res; src.start(); });
}

// ---------- ASSETS ----------
let girl, boy, stomach, girlAnim, boyAnim, prey, digestTarget;
let boyScale0 = 1;
const preyHome = { pos: new THREE.Vector3(), quat: new THREE.Quaternion(), scale: new THREE.Vector3(1, 1, 1) };

async function init() {
  let g, b, s;
  try {
    [g, b, s] = await Promise.all([loadGLB(CONFIG.girlUrl), loadGLB(CONFIG.boyUrl), loadGLB(CONFIG.stomachUrl)]);
  } catch (err) {
    console.error(err);
    setMsg('Failed to load models.\nServe this folder over http (python -m http.server 8000) and make sure the .glb files sit next to this html.\n' + (err.message || err));
    return;
  }
  girl = g.scene; boy = b.scene; stomach = s.scene;

  girl.position.set(0, 0, 0);
  // skinned meshes often get culled by a stale bounding sphere
  girl.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  scene.add(girl);

  boy.position.copy(CONFIG.boyPosition);
  boy.lookAt(0, boy.position.y, 0);
  boyScale0 = boy.scale.x;
  scene.add(boy);

  stomachRoot.add(stomach);

  // find belly nodes BEFORE building animators so we can strip their tracks
  prey = findNode(girl, CONFIG.preyName) || findNode(stomach, CONFIG.preyName) || findNode(girl, 'prey1');
  digestTarget = findNode(girl, CONFIG.digestTargetName) || findNode(stomach, CONFIG.digestTargetName);

  // diagnostics: every node name on the girl
  const names = [];
  girl.traverse(o => { if (o.name) names.push(o.name + (o.isMesh ? ' [mesh]' : '')); });
  console.log('Girl nodes:', names);
  console.log('Girl clips:', g.animations.map(c => c.name));
  if (!prey) console.warn('Node "' + CONFIG.preyName + '" not found. Pick the right name from the list above.');
  if (!digestTarget) console.warn('Node "' + CONFIG.digestTargetName + '" not found.');

  stripTracksFor(g.animations, [prey, digestTarget, ...CONFIG.hiddenExtras.map(n => findNode(girl, n))]);

  girlAnim = makeAnimator(girl, g.animations);
  boyAnim = makeAnimator(boy, b.animations);
  if (!girlAnim.has('idle')) console.warn('Girl has no "Idle" clip.');
  if (!girlAnim.has('walk')) console.warn('Girl has no "Walk" clip.');
  girlAnim.setBase('idle', 0);
  boyAnim.setBase('idle', 0);

  if (prey) {
    fixTinyScale(prey);
    preyHome.pos.copy(prey.position);
    preyHome.quat.copy(prey.quaternion);
    preyHome.scale.copy(prey.scale);
    prey.visible = false;
  }
  if (digestTarget) {
    fixTinyScale(digestTarget);
    digestTarget.visible = false;
  }
  CONFIG.hiddenExtras.forEach(n => { const o = findNode(girl, n); if (o) o.visible = false; });

  frameGirl();
  setMsg(HINT);
}

function frameGirl() {
  controls.target.set(girl.position.x, girl.position.y + 1, girl.position.z);
  camera.position.set(girl.position.x, girl.position.y + 2.5, girl.position.z + 6);
}

// ---------- INPUT: MOVE ----------
const keys = new Set();
addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

let targetYaw = 0;
function moveGirl(dt) {
  if (!girl) return;
  const f = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
  const r = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  const moving = !!(f || r);

  if (moving) {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
    const dir = fwd.multiplyScalar(f).add(right.multiplyScalar(r)).normalize();
    const step = dir.clone().multiplyScalar(CONFIG.moveSpeed * dt);
    girl.position.add(step);
    controls.target.add(step);
    camera.position.add(step);
    targetYaw = Math.atan2(dir.x, dir.z);
    girlAnim.setBase('walk');
  } else {
    girlAnim.setBase('idle');
  }

  let diff = targetYaw - girl.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  girl.rotation.y += diff * Math.min(1, CONFIG.turnSpeed * dt);
}

// ---------- INPUT: CLICK BOY ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;

function hitsBoy(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(boy, true).length > 0;
}
renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || !boy || state.eaten) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 5) return;
  if (hitsBoy(e)) eatBoy();
});
renderer.domElement.addEventListener('pointermove', e => {
  renderer.domElement.style.cursor = (boy && !state.eaten && hitsBoy(e)) ? 'pointer' : '';
});

// ---------- STATE: EAT / RESET ----------
function eatBoy() {
  state.eaten = true;
  state.digesting = false;
  state.digested = false;
  tween = null;

  scene.remove(boy);
  stomachRoot.add(boy);
  stomachRoot.updateWorldMatrix(true, true);
  const sb = new THREE.Box3().setFromObject(stomach);
  const centerWorld = sb.getCenter(new THREE.Vector3());
  boy.position.copy(stomachRoot.worldToLocal(centerWorld));
  boy.rotation.set(0, 0, 0);

  if (prey) {
    prey.position.copy(preyHome.pos);
    prey.quaternion.copy(preyHome.quat);
    prey.scale.copy(preyHome.scale);
    forceShow(prey);
  }
  if (digestTarget) digestTarget.visible = false;

  hud.style.display = 'flex';
  btnBurp.disabled = false;
  btnDigest.disabled = !(prey && digestTarget);
  renderer.domElement.style.cursor = '';
  setMsg('Boy is in the stomach.' + (!prey ? '\n(prey1 node not found, check console)' : '') + (!digestTarget ? '\n(bellydigest node not found, check console)' : ''));
}

function resetWorld() {
  tween = null;
  stomachRoot.remove(boy);
  boy.position.copy(CONFIG.boyPosition);
  boy.lookAt(0, boy.position.y, 0);
  boy.scale.setScalar(boyScale0);
  scene.add(boy);
  if (prey) {
    prey.position.copy(preyHome.pos);
    prey.quaternion.copy(preyHome.quat);
    prey.scale.copy(preyHome.scale);
    prey.visible = false;
  }
  if (digestTarget) digestTarget.visible = false;
  state.eaten = false;
  state.digesting = false;
  state.digested = false;
  hud.style.display = 'none';
  setMsg(HINT);
}

// ---------- BUTTONS ----------
let burping = false;
btnBurp.addEventListener('click', async () => {
  if (burping || state.digesting) return;
  burping = true;
  btnBurp.disabled = true;
  btnDigest.disabled = true;
  // sound and animation start together; buttons stay locked until BOTH are done
  await Promise.all([playBurp(), girlAnim.overlay('burp')]);
  burping = false;
  btnBurp.disabled = false;
  btnDigest.disabled = !(prey && digestTarget) || state.digesting || state.digested;
});

btnDigest.addEventListener('click', () => {
  if (burping || !prey || !digestTarget || state.digesting || state.digested) return;
  state.digesting = true;
  btnDigest.disabled = true;

  let toPos = new THREE.Vector3(), toQuat = new THREE.Quaternion(), toScale = new THREE.Vector3();
  if (prey.parent === digestTarget.parent) {
    toPos.copy(digestTarget.position);
    toQuat.copy(digestTarget.quaternion);
    toScale.copy(digestTarget.scale);
  } else {
    scene.updateMatrixWorld(true);
    new THREE.Matrix4().copy(prey.parent.matrixWorld).invert()
      .multiply(digestTarget.matrixWorld).decompose(toPos, toQuat, toScale);
  }

  tween = {
    t: 0,
    fromPos: prey.position.clone(), toPos,
    fromQuat: prey.quaternion.clone(), toQuat,
    fromScale: prey.scale.clone(), toScale,
  };
  setMsg('Digesting...');
});
btnReset.addEventListener('click', resetWorld);

function updateTween(dt) {
  if (!tween) return;
  tween.t = Math.min(1, tween.t + dt / CONFIG.digestDuration);
  const k = ease(tween.t);
  prey.position.lerpVectors(tween.fromPos, tween.toPos, k);
  prey.quaternion.slerpQuaternions(tween.fromQuat, tween.toQuat, k);
  prey.scale.lerpVectors(tween.fromScale, tween.toScale, k);
  if (tween.t >= 1) {
    tween = null;
    state.digesting = false;
    state.digested = true;
    prey.visible = false;
    forceShow(digestTarget);
    setMsg('Digest complete. Hit Reset to run it again.');
  }
}

// ---------- LOOP ----------
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (girl) {
    moveGirl(dt);
    girlAnim.update(dt);
    boyAnim.update(dt);
    updateTween(dt);
  }
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

init();
loop();
</script>
</body>
</html>
